version: 2

project_name: platypus

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/platypus
    binary: platypus
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/firfircelik/platypus-cli/pkg/platypus.Version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: firfircelik
    name: platypus-cli
  draft: false
  prerelease: auto

brews:
  - repository:
      owner: firfircelik
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/firfircelik/platypus-cli
    license: MIT
    description: "AI coding agent — get work done, not just conversation"
    install: |
      bin.install "platypus"
    test: |
      system "#{bin}/platypus", "--version"

scoops:
  - repository:
      owner: firfircelik
      name: scoop-bucket
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: https://github.com/firfircelik/platypus-cli
    license: MIT
    description: "AI coding agent — get work done, not just conversation"
